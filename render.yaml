# Blueprint do Render: cria o banco PostgreSQL e o serviço web a partir do repositório.
# Passo a passo completo em docs/DEPLOY.md
databases:
  - name: camilalee-db
    plan: free
    databaseName: camilalee
    user: camilalee

services:
  - type: web
    name: camilalee-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /api/saude
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY            # gerada pelo Render; nunca fica no GitHub
        generateValue: true
      - key: DATABASE_URL          # URL interna do banco (não exposta na internet)
        fromDatabase:
          name: camilalee-db
          property: connectionString
      - key: NUM_PROXIES           # o Render coloca 1 proxy na frente da aplicação
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      # As variáveis abaixo são preenchidas no painel do Render (sync: false = o valor
      # não vai para o repositório):
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # endereço do front-end, ex.: https://meu-site.com
        sync: false
