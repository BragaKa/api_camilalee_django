      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: servico
        schema:
          type: string
          enum:
          - AUDIOVISUAL
          - CARACTERIZACAO
          - CORTE_CABELO
          - NOIVAS
          - OUTROS
        description: |-
          * `NOIVAS` - Noivas
          * `AUDIOVISUAL` - Audiovisual
          * `CORTE_CABELO` - Corte de cabelo
          * `CARACTERIZACAO` - Caracterização
          * `OUTROS` - Outros
