          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - codigo
      - email
      - nova_senha
    ResumoLogins:
      type: object
      properties:
        periodo_dias:
          type: integer
        total_logins:
          type: integer
        logins_realizados:
          type: integer
        falhas_de_login:
          type: integer
        ultimo_acesso:
          type: string
          format: date-time
          nullable: true
      required:
      - falhas_de_login
      - logins_realizados
      - periodo_dias
      - total_logins
      - ultimo_acesso
    Saude:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ServicoEnum:
      enum:
      - NOIVAS
      - AUDIOVISUAL
      - CORTE_CABELO
      - CARACTERIZACAO
      - OUTROS
      type: string
      description: |-
        * `NOIVAS` - Noivas
        * `AUDIOVISUAL` - Audiovisual
        * `CORTE_CABELO` - Corte de cabelo
        * `CARACTERIZACAO` - Caracterização
        * `OUTROS` - Outros
    StatusEnum:
      enum:
      - SUCESSO
      - FALHA
      type: string
      description: |-
        * `SUCESSO` - Sucesso
        * `FALHA` - Falha
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokensRenovados:
      type: object
      properties:
        access:
          type: string
          description: Novo token de acesso.
        refresh:
          type: string
          description: Novo token de atualização (o anterior deixa de valer).
      required:
      - access
      - refresh
    Usuario:
      type: object
      description: Dados públicos de um usuário (nunca inclui a senha).
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        telefone:
          type: string
          readOnly: true
        perfil:
          type: string
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - email
      - id
      - nome
      - perfil
      - telefone
    UsuarioAtualizacaoRequest:
      type: object
      description: Atualização dos próprios dados. O e-mail e o perfil não podem ser
        alterados aqui.
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 120
        telefone:
          type: string
          minLength: 1
          maxLength: 30
      required:
      - nome
      - telefone
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Autenticação
  description: Cadastro, login, renovação de token, logout e recuperação de senha.
- name: Usuários
  description: Dados do usuário autenticado.
- name: Mensagens
  description: Formulário de contato / solicitação de serviços (exige login).
- name: Depoimentos
  description: Depoimentos de clientes (leitura pública; escrita só ADMIN).
- name: Administração
  description: Gestão de usuários e histórico de logins (somente ADMIN).
- name: Sistema
  description: Verificação de disponibilidade.
