components:
  schemas:
    AdminUsuario:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
          minLength: 2
        email:
          type: string
          format: email
          readOnly: true
        telefone:
          type: string
          maxLength: 30
        perfil:
          type: string
          description: ADMIN ou USUARIO.
        is_active:
          type: boolean
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - email
      - id
      - nome
      - perfil
      - telefone
    AdminUsuarioRequest:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 120
        telefone:
          type: string
          minLength: 1
          maxLength: 30
        perfil:
          type: string
          minLength: 1
          description: ADMIN ou USUARIO.
        is_active:
          type: boolean
      required:
      - nome
      - perfil
      - telefone
    CadastroRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 2
          description: Nome completo.
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
          description: Usado como login. Deve ser único.
          maxLength: 180
        telefone:
          type: string
          minLength: 1
          description: 'Telefone com DDD, ex.: 61999999999 ou (61) 99999-9999.'
          maxLength: 30
        senha:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo de 8 caracteres; não pode ser comum nem só numérica.
          maxLength: 128
      required:
      - email
      - nome
      - senha
      - telefone
    Depoimento:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        id:
          type: integer
          readOnly: true
        nome_autor:
          type: string
          description: Nome do cliente (até 120 caracteres).
          maxLength: 120
        profissao:
          type: string
          description: 'Profissão ou qualificação, ex.: Noiva, Atriz.'
          maxLength: 120
        texto:
          type: string
          description: Conteúdo do depoimento (até 2000 caracteres).
          maxLength: 2000
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - id
      - nome_autor
      - profissao
      - texto
    DepoimentoRequest:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        nome_autor:
          type: string
          minLength: 1
          description: Nome do cliente (até 120 caracteres).
          maxLength: 120
        profissao:
          type: string
          minLength: 1
          description: 'Profissão ou qualificação, ex.: Noiva, Atriz.'
          maxLength: 120
        texto:
          type: string
          minLength: 1
          description: Conteúdo do depoimento (até 2000 caracteres).
          maxLength: 2000
      required:
      - nome_autor
      - profissao
      - texto
    Erro:
      type: object
      description: Formato padrão de todas as respostas de erro da API (usado na documentação).
      properties:
        status:
          type: integer
          description: Código HTTP do erro.
        erro:
          type: string
          description: Título curto do erro.
        mensagem:
          type: string
          description: Explicação legível do problema.
        detalhes:
          type: object
          additionalProperties: {}
          description: Erros por campo (somente em erros de validação).
      required:
      - erro
      - mensagem
      - status
    EsqueciSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 180
      required:
      - email
    HistoricoLogin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          readOnly: true
          nullable: true
        usuario_nome:
          type: string
          readOnly: true
        usuario_email:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
        sistema_operacional:
          type: string
          readOnly: true
        navegador:
          type: string
          readOnly: true
        dispositivo:
          type: string
          readOnly: true
        localizacao:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        data_hora:
          type: string
          format: date-time
          readOnly: true
      required:
      - data_hora
      - dispositivo
      - id
      - ip
      - localizacao
      - navegador
      - sistema_operacional
      - status
      - usuario
      - usuario_email
      - usuario_nome
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 180
        senha:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - senha
    LoginResposta:
      type: object
      properties:
        access:
          type: string
          description: 'Token de acesso (enviar em Authorization: Bearer).'
        refresh:
          type: string
          description: Token para renovar o acesso e para o logout.
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Validade do token de acesso, em segundos.
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
      - access
      - expires_in
      - refresh
      - usuario
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: Token de atualização a ser invalidado.
      required:
      - refresh
    Mensagem:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        id:
          type: integer
          readOnly: true
        servico:
          allOf:
          - $ref: '#/components/schemas/ServicoEnum'
          description: |-
            Serviço de interesse: NOIVAS, AUDIOVISUAL, CORTE_CABELO, CARACTERIZACAO, OUTROS.

            * `NOIVAS` - Noivas
            * `AUDIOVISUAL` - Audiovisual
            * `CORTE_CABELO` - Corte de cabelo
            * `CARACTERIZACAO` - Caracterização
            * `OUTROS` - Outros
        mensagem:
          type: string
          description: Texto da mensagem (até 1000 caracteres).
          maxLength: 1000
        enviado_em:
          type: string
          format: date-time
          readOnly: true
        usuario_id:
          type: integer
          readOnly: true
          description: Quem enviou a mensagem.
        usuario_nome:
          type: string
          readOnly: true
      required:
      - enviado_em
      - id
      - mensagem
      - servico
      - usuario_id
      - usuario_nome
    MensagemRequest:
      type: object
      description: ModelSerializer que usa TextoEstrito para todos os campos de texto
        do modelo.
      properties:
        servico:
          allOf:
          - $ref: '#/components/schemas/ServicoEnum'
          description: |-
            Serviço de interesse: NOIVAS, AUDIOVISUAL, CORTE_CABELO, CARACTERIZACAO, OUTROS.

            * `NOIVAS` - Noivas
            * `AUDIOVISUAL` - Audiovisual
            * `CORTE_CABELO` - Corte de cabelo
