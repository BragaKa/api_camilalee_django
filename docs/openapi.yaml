openapi: 3.0.3
info:
  title: Camila Lee API
  version: 1.0.0
  description: |-
    API REST do site da profissional Camila Lee (Crocodilo Lee), reimplementada em **Python/Django REST Framework** para a disciplina Programação para Internet (TSI/IFB).

    ## Como autenticar
    1. Cadastre-se em `POST /api/auth/cadastro` (ou use uma conta existente).
    2. Faça login em `POST /api/auth/login` e copie o valor de `access`.
    3. Clique em **Authorize** (cadeado) e cole o token. O Swagger envia o cabeçalho `Authorization: Bearer <token>` nas próximas chamadas.

    ## Perfis
    - `USUARIO`: acessa e gerencia apenas as próprias mensagens e o próprio cadastro.
    - `ADMIN`: gerencia depoimentos, usuários e consulta o histórico de logins.

    ## Formato dos erros
    Todas as respostas de erro seguem o formato `{"status": 400, "erro": "Requisição inválida", "mensagem": "...", "detalhes": {"campo": ["motivo"]}}`.

    ## Limites de uso
    Login, cadastro e recuperação de senha têm limite de requisições por IP (HTTP 429 quando excedido).
paths:
  /api/admin/logins:
    get:
      operationId: admin_logins_list
      description: |-
        Lista paginada dos acessos (sucessos e falhas). Filtros: `status` (SUCESSO/FALHA), `usuario` (id), `data_inicio` e `data_fim` (AAAA-MM-DD). Busca (`search`) por nome, e-mail, IP, navegador ou sistema. Ordenação (`ordering`): `data_hora`, `status`.

        **Autenticação:** exige `Bearer` token de ADMIN.
      summary: Listar o histórico de logins
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: AAAA-MM-DD (inclusive).
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: AAAA-MM-DD (inclusive).
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FALHA
          - SUCESSO
        description: |-
          * `SUCESSO` - Sucesso
          * `FALHA` - Falha
      - in: query
        name: usuario
        schema:
          type: integer
      tags:
      - Administração
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoricoLoginList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
  /api/admin/logins/resumo:
    get:
      operationId: admin_logins_resumo_retrieve
      description: |-
        Totais de logins, sucessos, falhas e último acesso bem-sucedido no período (padrão: 30 dias).

        **Autenticação:** exige `Bearer` token de ADMIN.
      summary: Indicadores de acesso
      parameters:
      - in: query
        name: dias
        schema:
          type: integer
          default: 30
        description: 'Período em dias (1 a 365). Padrão: 30.'
      tags:
      - Administração
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoLogins'
              examples:
                Resumo:
                  value:
                    periodo_dias: 30
                    total_logins: 42
                    logins_realizados: 38
                    falhas_de_login: 4
                    ultimo_acesso: '2026-11-24T18:30:00-03:00'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
  /api/admin/usuarios:
    get:
      operationId: admin_usuarios_list
      description: |-
        Lista paginada de usuários. Filtros: `perfil`, `is_active`. Busca (`search`) por nome ou e-mail. Ordenação (`ordering`): `nome`, `email`, `criado_em`, `id` (prefixe com `-` para decrescente).

        **Autenticação:** exige `Bearer` token de ADMIN.
      summary: Listar usuários
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: perfil
        schema:
          type: string
        description: ADMIN ou USUARIO.
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - Administração
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUsuarioList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
  /api/admin/usuarios/{id}:
    get:
      operationId: admin_usuarios_retrieve
      description: '**Autenticação:** exige `Bearer` token de ADMIN.'
      summary: Consultar um usuário
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este usuario.
        required: true
      tags:
      - Administração
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuario'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                RegistroInexistente:
                  value:
                    status: 404
                    erro: Não encontrado
                    mensagem: Não encontrado.
                  summary: Registro inexistente
          description: Registro inexistente (ou que não pertence ao usuário autenticado).
    put:
      operationId: admin_usuarios_update
      description: |-
        Altera nome, telefone, perfil e situação (`is_active`). O e-mail não é editável. Um ADMIN não pode rebaixar o próprio perfil.

        **Autenticação:** exige `Bearer` token de ADMIN.
      summary: Atualizar um usuário (completo)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este usuario.
        required: true
      tags:
      - Administração
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsuarioRequest'
            examples:
              Requisição:
                value:
                  nome: Maria Souza
                  telefone: '61999999999'
                  perfil: ADMIN
                  is_active: true
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuario'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                RegistroInexistente:
                  value:
                    status: 404
                    erro: Não encontrado
                    mensagem: Não encontrado.
                  summary: Registro inexistente
          description: Registro inexistente (ou que não pertence ao usuário autenticado).
    patch:
      operationId: admin_usuarios_partial_update
      description: '**Autenticação:** exige `Bearer` token de ADMIN.'
      summary: Atualizar um usuário (parcial)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este usuario.
        required: true
      tags:
      - Administração
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUsuarioRequest'
            examples:
              PromoverAADMIN:
                value:
                  perfil: ADMIN
                summary: Promover a ADMIN
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuario'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                RegistroInexistente:
                  value:
                    status: 404
                    erro: Não encontrado
                    mensagem: Não encontrado.
                  summary: Registro inexistente
          description: Registro inexistente (ou que não pertence ao usuário autenticado).
    delete:
      operationId: admin_usuarios_destroy
      description: |-
        Remove o usuário e suas mensagens. Um ADMIN não pode excluir a si mesmo por aqui (use `DELETE /api/usuarios/me`).

        **Autenticação:** exige `Bearer` token de ADMIN.
      summary: Excluir um usuário
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este usuario.
        required: true
      tags:
      - Administração
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                SemToken:
                  value:
                    status: 401
                    erro: Não autenticado
                    mensagem: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
          description: 'Não autenticado: token ausente, inválido ou expirado.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                PerfilInsuficiente:
                  value:
                    status: 403
                    erro: Acesso negado
                    mensagem: Acesso restrito a administradores.
                  summary: Perfil insuficiente
          description: 'Acesso negado: o usuário autenticado não tem permissão (perfil
            insuficiente).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                RegistroInexistente:
                  value:
                    status: 404
                    erro: Não encontrado
                    mensagem: Não encontrado.
                  summary: Registro inexistente
          description: Registro inexistente (ou que não pertence ao usuário autenticado).
  /api/auth/cadastro:
    post:
      operationId: auth_cadastro_create
      description: |-
        Cria uma conta com perfil `USUARIO`. A senha é armazenada apenas como hash. O perfil não pode ser escolhido pelo cliente (somente um ADMIN altera perfis).

        **Autenticação:** não exige token.
      summary: Cadastrar usuário
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
            examples:
              Requisição:
                value:
                  nome: Maria Souza
                  email: maria@email.com
                  telefone: '61999999999'
                  senha: Senha@Forte2026
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                UsuárioCriado:
                  value:
                    id: 7
                    nome: Maria Souza
                    email: maria@email.com
                    telefone: '61999999999'
                    perfil: USUARIO
                    criado_em: '2026-11-24T18:30:00-03:00'
                  summary: Usuário criado
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                E-mailDuplicado:
                  value:
                    status: 409
                    erro: Conflito
                    mensagem: Já existe um usuário cadastrado com este e-mail.
                  summary: E-mail duplicado
          description: 'Conflito: o recurso já existe.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                LimiteExcedido:
                  value:
                    status: 429
                    erro: Muitas requisições
                    mensagem: Pedido foi limitado (throttled). Disponível novamente
                      em 42 segundos.
                  summary: Limite excedido
          description: 'Muitas requisições: limite de uso por IP excedido (veja o
            cabeçalho Retry-After).'
  /api/auth/esqueci-senha:
    post:
      operationId: auth_esqueci_senha_create
      description: |-
        Envia por e-mail um código de 6 dígitos (uso único, validade de 15 minutos). A resposta é **sempre a mesma**, exista ou não o e-mail, para não revelar quais contas existem.

        **Autenticação:** não exige token. Limite: 5 por hora por IP.
      summary: Solicitar código de recuperação de senha
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaRequest'
            examples:
              Requisição:
                value:
                  email: maria@email.com
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemSimples'
              examples:
                Resposta:
                  value:
                    mensagem: Se o e-mail estiver cadastrado, enviaremos um código
                      de 6 dígitos.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                LimiteExcedido:
                  value:
                    status: 429
                    erro: Muitas requisições
                    mensagem: Pedido foi limitado (throttled). Disponível novamente
                      em 42 segundos.
                  summary: Limite excedido
          description: 'Muitas requisições: limite de uso por IP excedido (veja o
            cabeçalho Retry-After).'
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Valida e-mail e senha e devolve os tokens JWT. Cada tentativa (com sucesso ou falha) é registrada no histórico de logins (IP, sistema, navegador, dispositivo).

        **Autenticação:** não exige token. Limite: 10 tentativas por minuto por IP.
      summary: Fazer login
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Requisição:
                value:
                  email: maria@email.com
                  senha: Senha@Forte2026
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
              examples:
                LoginRealizado:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: Bearer
                    expires_in: 1800
                    usuario:
                      id: 7
                      nome: Maria Souza
                      email: maria@email.com
                      telefone: '61999999999'
                      perfil: USUARIO
                      criado_em: '2026-11-24T18:30:00-03:00'
                  summary: Login realizado
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                ErroDeValidação:
                  value:
                    status: 400
                    erro: Requisição inválida
                    mensagem: Os dados enviados são inválidos.
                    detalhes:
                      campo:
                      - Este campo é obrigatório.
                  summary: Erro de validação
          description: 'Requisição inválida: campo obrigatório ausente, tipo incorreto
            ou valor fora das regras.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                CredenciaisInválidas:
