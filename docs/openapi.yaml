      operationId: mensagens_list
      description: |-
        Lista paginada. Um `USUARIO` vê só as próprias mensagens; um `ADMIN` vê todas.

        Filtros: `servico`, `usuario` (id), `data_inicio`, `data_fim` (AAAA-MM-DD). Busca (`search`) no texto da mensagem ou no nome do remetente. Ordenação (`ordering`): `enviado_em`, `servico`, `id` (prefixe com `-` para decrescente). Paginação: `page` e `page_size` (máx. 100).

        **Autenticação:** exige `Bearer` token.
      summary: Listar mensagens
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: AAAA-MM-DD (inclusive).
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: AAAA-MM-DD (inclusive).
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
